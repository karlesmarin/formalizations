name: docs

# API documentation of every declaration (doc-gen4), published on GitHub Pages at
# https://karlesmarin.github.io/formalizations/docs/ — so that each theorem has a page a search engine can find.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  # a push must not cancel a docs build in progress (the first one documents Mathlib: ~1 h)
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      # since 2026-10-27 the srcUri step of doc-gen runs out of memory on the hosted runner ("resource exhausted,
      # not enough memory"): give it swap space
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile_docs
          sudo chmod 600 /swapfile_docs
          sudo mkswap /swapfile_docs
          sudo swapon /swapfile_docs
          free -h
      # the swap alone did not help: every srcUri task fails in the same second with 15 GB RAM + 11 GB swap free, i.e.
      # ENOMEM when spawning a child of a process with a large virtual reservation (heuristic overcommit refuses it)
      - name: Allow memory overcommit
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          ulimit -a
      - uses: leanprover-community/docgen-action@main
        with:
          api-docs: true
          blueprint: false
          build-page: false
          # the action only builds; the house style is appended below and the site is uploaded and deployed here
          deploy: false
      # same look as https://karlesmarin.github.io/blueprints/ (blue bar, grey ground, content on a white card):
      # scripts/docs_house.css is appended to doc-gen4's own style.css; it only sets colours, shadows and spacing
      - name: House style
        run: |
          f="$(find docs -maxdepth 2 -name style.css | head -1)"
          test -n "$f" || { echo "style.css of doc-gen4 not found under docs/"; find docs -maxdepth 2 | head -30; exit 1; }
          cat scripts/docs_house.css >> "$f"
          echo "house style appended to $f"
      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
