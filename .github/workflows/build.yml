name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Every module imported (else not built, not documented)
        run: sh scripts/check_imports.sh
      - name: Axiom audit
        run: sh scripts/check_axioms.sh
      - name: Usage examples of the Reusable layer compile
        run: lake env lean FormalizationsTest/ReusableExamples.lean
      - name: Usage examples of the Reusable layer compile with the minimal import of each area
        run: for f in FormalizationsTest/Reusable*Example.lean; do echo "$f"; lake env lean "$f" || exit 1; done
