[[entry]]
id = "R0010"
lean_name = "Formalizations.Reusable.cotes_harmonic_mean_polar"
statement = "Cotes' harmonic means theorem: if a line p + t v meets a real plane curve f = 0 in deg g real points (g(t) = f(p + t v) splits), the harmonic-mean point lies on the polar line ∇f(p)·(q − p) = −d f(p) of p."
