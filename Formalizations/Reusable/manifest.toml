# Manifest of the reusable layer of karlesmarin/formalizations (package version 0.1.0).
# One entry per theorem `Formalizations.Reusable.<name>`. Each is proved by the archive theorem in `archive_decl`
# (no proof is copied). Usage examples: FormalizationsTest/ReusableExamples.lean. Axioms: FormalizationsTest/Axioms.lean
# (every entry depends only on propext, Classical.choice, Quot.sound).
# Status: `reusable` = stable name, maintained across releases. `upstream_candidate` = whether the statement looks like a
# short lemma in an existing Mathlib theory; any Mathlib PR is decided and written by the maintainer, not generated.

[layer]
package = "formalizations"
version = "0.1.0"
lean = "leanprover/lean4:v4.35.0"
mathlib = "f0b4c8150aa0dbc758aff1291410c5ae335aff3a"
import_all = "Formalizations.Reusable"

[[entry]]
id = "R0001"
lean_name = "Formalizations.Reusable.pappus_hexagon"
statement = "Pappus's hexagon theorem in homogeneous coordinates over any commutative ring: if A, B, C are collinear and a, b, c are collinear, the meets Ab∩aB, Ac∩aC, Bc∩bC are collinear, with no non-degeneracy hypothesis."
area = "Geometry"
msc = "51A20"
import = "Formalizations.Reusable.Geometry"
archive_module = "Formalizations.Geometry.Projective.Pappus"
archive_decl = "Pappus.pappus"
paper = "none (Theorem of the Day)"
classical_reference = "Pappus of Alexandria, Collection, Book VII (c. 320 AD)"
status = "reusable"
upstream_candidate = false
upstream_reason = "the proof is a degree-9 ideal-membership certificate of several hundred terms; Mathlib would want a synthetic or affine proof"
repo_dependencies = []

[[entry]]
id = "R0002"
lean_name = "Formalizations.Reusable.wolstenholme_defect_eq_sq_add_sq"
statement = "If A + B + C = π, then x² + y² + z² − (2yz cos A + 2zx cos B + 2xy cos C) = (x − z cos B − y cos C)² + (z sin B − y sin C)² for all real x, y, z; hence Wolstenholme's inequality."
area = "Geometry"
msc = "51M16"
import = "Formalizations.Reusable.Geometry"
archive_module = "Formalizations.Geometry.Euclidean.WolstenholmeInequality"
archive_decl = "WolstenholmeInequality.sub_eq_sq_add_sq"
paper = "none"
classical_reference = "J. Wolstenholme, A Book of Mathematical Problems, Macmillan, 1867"
status = "reusable"
upstream_candidate = false
upstream_reason = "an olympiad-style identity with a six-line proof; Mathlib's Archive at most"
repo_dependencies = []

[[entry]]
id = "R0003"
lean_name = "Formalizations.Reusable.torricelli_trumpet"
statement = "The solid of revolution of y = 1/x, x ≥ 1 (Torricelli's trumpet, Gabriel's horn) has Lebesgue volume π, while its plane section {x ≥ 1, |y| ≤ 1/x} has infinite area."
area = "MeasureTheory"
msc = "28A75"
import = "Formalizations.Reusable.MeasureTheory"
archive_module = "Formalizations.MeasureTheory.Torricelli"
archive_decl = "Torricelli.volume_trumpet, Torricelli.volume_section_eq_top"
paper = "none (Theorem of the Day)"
classical_reference = "E. Torricelli, Opera geometrica (1644)"
status = "reusable"
upstream_candidate = false
upstream_reason = "a named example rather than API; it rests on the archive's own Pappus–Guldin volume formula"
repo_dependencies = ["Formalizations.MeasureTheory.PappusGuldin"]

[[entry]]
id = "R0004"
lean_name = "Formalizations.Reusable.airy_eq_zeros_unbounded_below"
statement = "Every solution f of the Airy equation f'' = x f on ℝ has zeros unbounded below: for every M there is x < M with f x = 0."
area = "Analysis"
msc = "34C10"
import = "Formalizations.Reusable.Analysis"
archive_module = "Formalizations.Analysis.SpecialFunctions.Airy.Basic"
archive_decl = "Airy.sturm_unbounded_zeros"
paper = "C. Marín, How a Falling Particle Counts Its Floors (2026), doi:10.5281/zenodo.20787671"
classical_reference = "E. A. Coddington, N. Levinson, Theory of Ordinary Differential Equations (1955), ch. 8; DLMF §9.9"
status = "reusable"
upstream_candidate = false
upstream_reason = "Mathlib has no Sturm comparison theory; the right upstream object is a general Sturm comparison theorem, not this instance"
repo_dependencies = []

[[entry]]
id = "R0005"
lean_name = "Formalizations.Reusable.glasser_integral"
statement = "For a ≥ 0 and b > 0, ∫_{v>0} v^{-1/2} exp(−a/v − b v) dv = √(π/b) exp(−2√(ab)) (the modified Bessel K_{1/2} integral)."
area = "Analysis"
msc = "33C10"
import = "Formalizations.Reusable.Analysis"
archive_module = "Formalizations.Probability.Distributions.Superstatistics.LaplaceMixture"
archive_decl = "Superstatistics.glasser_integral"
paper = "none cited in the module (superstatistics series)"
classical_reference = "M. L. Glasser, A remarkable property of definite integrals, Math. Comp. 40 (1983) 561"
status = "reusable"
upstream_candidate = true
upstream_reason = "a single closed-form integral in Mathlib's existing improper-integral theory, next to the Gamma and Gaussian integrals"
repo_dependencies = []

