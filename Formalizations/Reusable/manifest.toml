area = "Geometry"
msc = "51M16"
import = "Formalizations.Reusable.Geometry"
archive_module = "Formalizations.Geometry.Euclidean.WolstenholmeInequality"
archive_decl = "WolstenholmeInequality.sub_eq_sq_add_sq"
paper = "none"
classical_reference = "J. Wolstenholme, A Book of Mathematical Problems, Macmillan, 1867"
status = "reusable"
role = "showcase"
upstream_candidate = false
upstream_reason = "an olympiad-style identity with a six-line proof; Mathlib's Archive at most"
repo_dependencies = []

