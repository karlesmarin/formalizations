msc = "14H50"
import = "Formalizations.Reusable.AlgebraicGeometry"
archive_module = "Formalizations.AlgebraicGeometry.PlaneCurve.Cotes"
archive_decl = "Cotes.harmonic_mean_polar"
paper = "none"
classical_reference = "R. Cotes, Harmonia Mensurarum, Cambridge, 1722"
status = "reusable"
upstream_candidate = false
upstream_reason = "the hypotheses (roots.card = natDegree, nonzero sum of inverse roots) are tailored to the proof; a Mathlib version would need plane-curve API"
repo_dependencies = []
