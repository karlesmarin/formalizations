# Formalizations: Lean 4 / Mathlib formalizations by Carles Marín, organized like Mathlib (by mathematical area).
# Build: `lake exe cache get && lake build`. Axiom audit: `scripts/check_axioms.sh`.
# TOML, not lakefile.lean: leanprover-community/docgen-action (docs.yml) only reads lakefile.toml.
name = "formalizations"
# Package version (Lake `version`); the matching Git tag is `v0.2.0`. `versionTags` tells package indices such as
# Reservoir which tags are versions: the `verLike` preset is the tags starting with `v` and a digit.
version = "0.2.0"
versionTags = {preset = "verLike"}
defaultTargets = ["Formalizations"]
# GitHub Release Builds (Lake README, «GitHub Release Builds»; Lake/Config/PackageConfig.lean of Lean v4.35.0): when
# this package is a dependency, Lake first tries to download `formalizations-<System.Platform.target>.tar.gz` from the
# GitHub release whose tag points at the required commit, unpacks it into the build directory and builds from source
# only if that fails. The archives are attached by .github/workflows/release.yml (`lake upload <tag>`).
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "f0b4c8150aa0dbc758aff1291410c5ae335aff3a"

[[lean_lib]]
name = "Formalizations"
globs = ["Formalizations.*"]

[[lean_lib]]
name = "FormalizationsTest"
globs = ["FormalizationsTest.+"]
